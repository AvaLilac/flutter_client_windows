
name: Linux Canary Build (Artifact)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number appended to the version (defaults to the run number)
        required: false
        type: string
  workflow_call:
    inputs:
      build_number:
        description: Build number appended to the version (defaults to the run number)
        required: false
        type: string
    outputs:
      version:
        description: Application build version
        value: ${{ jobs.build-and-pack.outputs.version }}

permissions:
  contents: read

jobs:
  build-and-pack:
    name: Build Linux canary app
    runs-on: ubuntu-latest

    container:
      image: debian:sid

    env:
      DEBIAN_FRONTEND: noninteractive

    defaults:
      run:
        shell: bash

    outputs:
      version: ${{ steps.version.outputs.pack_version }}

    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates curl git unzip xz-utils zip tar zstd jq file \
            build-essential python3

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Sync submodules
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --recursive

      - name: Install Linux build dependencies
        run: |
          apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-dev \
            libmpv-dev \
            libasound2-dev libpulse-dev \
            libwebkit2gtk-4.1-dev \
            libunwind-dev libx11-dev libxkbcommon-dev \
            libnotify-dev libkeybinder-3.0-dev \
            libglu1-mesa-dev libepoxy-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-libav \
            libwayland-dev libwpe-1.0-dev libwpebackend-fdo-1.0-dev

      - name: Install WPE WebKit
        run: |
          apt-cache search wpewebkit || true
          FOUND=""
          for pkg in libwpewebkit-2.0-dev libwpewebkit-1.1-dev libwpewebkit-1.0-dev; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              apt-get install -y "$pkg"
              FOUND="$pkg"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No WPE WebKit dev package available in the apt repositories"
            exit 1
          fi
          echo "Installed $FOUND"
          pkg-config --list-all | grep -i wpe || true

      - name: Resolve version
        id: version
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 .github/scripts/app_version.py read
          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid build number: $BUILD_NUMBER"
            exit 1
          fi
          VERSION_NAME="$(grep '^release_drafter_version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2 | tr -d '\r')"
          {
            echo "build_number=$BUILD_NUMBER"
            echo "pack_version=$VERSION_NAME-canary.$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable

      - name: Set up Rust and native asset build hooks
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add x86_64-unknown-linux-gnu
          flutter config --enable-linux-desktop
          flutter config --enable-native-assets

      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-sid-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-sid-pub-

      - name: Configure OSS build tree
        run: dart tool/configure_build.dart --profile=oss

      - name: Get dependencies
        run: flutter pub get

      - name: Prefetch Rust toolchains for native asset hooks
        run: bash tool/prefetch_native_rust_toolchains.sh

      - name: Patch inappwebview Linux plugin for older WPE headers
        run: |
          CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"

          if [ ! -d "$CACHE_DIR" ]; then
            echo "::warning::Pub cache directory not found: $CACHE_DIR"
            exit 0
          fi

          FILES=$(grep -RIl --include='*.cc' 'WPE_SETTING_DISABLE_ANIMATIONS' "$CACHE_DIR" 2>/dev/null || true)

          if [ -z "$FILES" ]; then
            echo "::notice::WPE_SETTING_DISABLE_ANIMATIONS not found. No patch needed."
            exit 0
          fi

          while IFS= read -r FILE; do
            sed -i 's|WPE_SETTING_DISABLE_ANIMATIONS|"/wpe-platform/disable-animations"|g' "$FILE"
            echo "Patched: $FILE"
            grep -n "disable-animations" "$FILE"
          done <<< "$FILES"

      - name: Run build_runner
        run: dart run build_runner build

      - name: Build Linux app
        env:
          CXXFLAGS: -Wno-error=deprecated-declarations
          VERSION_NAME: ${{ steps.version.outputs.release_drafter_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flutter build linux --release -v \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define-from-file=tool/dart_defines/canary.json \
            --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --dart-define=CANARY_NUMBER="$BUILD_NUMBER" 2>&1 | tee build.log

          APP_DIR="build/linux/x64/release/bundle"

          if [ ! -f "$APP_DIR/fluxer_oxygen" ]; then
            echo "::error::Expected executable at $APP_DIR/fluxer_oxygen"
            echo "----- Bundle contents -----"
            ls -la "$APP_DIR" || true
            exit 1
          fi

      - name: Rename bundled libraries to their sonames
        run: |
          LIB_DIR="build/linux/x64/release/bundle/lib"
          if [ -d "$LIB_DIR" ]; then
            cd "$LIB_DIR"
            for f in libWPEWebKit-2.0.so.1.* libwpe-1.0.so.1.*; do
              [ -e "$f" ] || continue
              mv "$f" "$(echo "$f" | sed -E 's/(\.so\.[0-9]+)\..*/\1/')"
            done
            ls -la | grep -iE 'wpe' || true
          fi

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -nE "error:|Error:|CMake Error|fatal error|FAILED|undefined reference|not found" build.log | head -60
            echo "-----"
            tail -n 40 build.log
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oxygen-canary-linux-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oxygen-canary-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 7
