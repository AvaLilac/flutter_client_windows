name: macOS Canary Build (Artifact)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (optional)
        required: false
        type: string
  workflow_call:
    inputs:
      build_number:
        description: Build number (optional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS Canary (Unsigned)
    runs-on: macos-26
    environment: release-builds

    outputs:
      version: ${{ steps.version.outputs.pack_version }}

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      PUSH_PROVIDER: unifiedpush
      OXYGEN_APP_NAME: Fluxer Oxygen

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Resolve build version
        id: version
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          VERSION_NAME=$(python3 .github/scripts/app_version.py read)
          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid build number: $BUILD_NUMBER"
            exit 1
          fi

          PACK_VERSION="$VERSION_NAME-canary.$BUILD_NUMBER"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pack_version=$PACK_VERSION" >> "$GITHUB_OUTPUT"

          echo "Building version: $PACK_VERSION"

      - name: Set up Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Set up Rust and native asset build hooks
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi

          rustup show active-toolchain || rustup toolchain install stable
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          flutter config --enable-native-assets

      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure OSS build tree
        run: dart tool/configure_build.dart --profile=oss

      - name: Apply macOS dependency overrides
        run: bash tool/apply_macos_pub_overrides.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Patch secure storage to use the legacy macOS keychain
        run: |
          CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          FILES=$(grep -rl "usesDataProtectionKeychain" "$CACHE_DIR"/flutter_secure_storage* --include="*.dart" || true)

          if [ -z "$FILES" ]; then
            echo "No usesDataProtectionKeychain declarations found"
            exit 1
          fi

          for f in $FILES; do
            sed -i '' 's/usesDataProtectionKeychain = true/usesDataProtectionKeychain = false/g' "$f"
          done

          grep -rn "usesDataProtectionKeychain" $FILES | head -30

          if ! grep -rq "usesDataProtectionKeychain = false" $FILES; then
            echo "Default value was not patched"
            exit 1
          fi

      - name: Show secure storage usage in app code
        run: |
          grep -rn "usesDataProtectionKeychain\|MacOsOptions\|FlutterSecureStorage(" lib packages --include="*.dart" | head -20 || true

      - name: Run build_runner
        run: dart run build_runner build

      - name: Prepare macOS project files with dart defines
        run: |
          flutter build macos \
            --config-only \
            --release \
            --flavor canary \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --dart-define-from-file=tool/dart_defines/canary.json \
            --dart-define=PUSH_PROVIDER=${PUSH_PROVIDER}

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=macos

      - name: Build macOS app (unsigned universal)
        run: |
          set -o pipefail

          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme canary \
            -configuration Release-canary \
            -derivedDataPath build/macos-direct \
            -destination 'generic/platform=macOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            build 2>&1 | tee xcodebuild.log

          APP_DIR="build/macos-direct/Build/Products/Release-canary"
          APP_PATH="$APP_DIR/$OXYGEN_APP_NAME.app"

          test -d "$APP_PATH" || {
            echo "App not found at $APP_PATH"
            find build/macos-direct/Build/Products -maxdepth 3 -name '*.app' -print
            exit 1
          }

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          lipo -info "$APP_PATH/Contents/MacOS/$OXYGEN_APP_NAME"

      - name: Ad-hoc sign app
        run: |
          codesign --force --deep --sign - "$APP_PATH"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Fluxer-Oxygen-macos.zip

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oxygen-canary-macos-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxygen-canary-darwin
          path: Fluxer-Oxygen-macos.zip
          if-no-files-found: error
          retention-days: 30
