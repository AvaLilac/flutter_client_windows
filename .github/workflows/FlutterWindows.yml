name: Windows Canary Build (unofficial)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (canary)

    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    env:
      PUSH_PROVIDER: unifiedpush

      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      PUB_CACHE: D:\pub-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Set up Flutter

        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable

      - name: Set up Rust and native asset build hooks
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup default stable
          flutter config --enable-windows-desktop
          flutter config --enable-native-assets

      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: D:\pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure OSS build tree
        run: dart tool/configure_build.dart --profile=oss

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Build Windows release
        run: |
          flutter build windows --release \
            --dart-define-from-file=tool/dart_defines/canary.json \
            --dart-define=PUSH_PROVIDER=${PUSH_PROVIDER}

      - name: Package build
        run: |
          mkdir -p dist
          powershell -NoProfile -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/fluxer-canary-windows-x64.zip'"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-canary-windows-x64
          path: dist/fluxer-canary-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
